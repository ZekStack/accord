name: CI

on:
  push:
    branches: [ '**' ]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  ARDUINO_CLI_VERSION: 1.5.0
  ARDUINO_NETWORK_CONNECTION_TIMEOUT: 240s
  ESP32_CORE_VERSION: 3.3.9
  PIOARDUINO_PLATFORM_URL: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
  PIOARDUINO_PLATFORM_VERSION: 55.03.39
  PIOARDUINO_VERSION: 6.1.19
  STRATA_VERSION: v0.1.2

jobs:
  source-audit:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit production sources
        run: |
          set -e
          if grep -RInE '(^|[^[:alnum:]_])throw([^[:alnum:]_]|$)|std::abort[[:space:]]*\(|std::string|std::vector|delay[[:space:]]*\(|ESP[.]restart[[:space:]]*\(' src; then
            echo "Embedded safety audit failed"
            exit 1
          fi
          if grep -RInE 'heap_caps_|MALLOC_CAP_|ps_malloc|xSemaphoreCreate|std::make_unique|std::make_shared|(^|[^[:alnum:]_])malloc[[:space:]]*\(|(^|[^[:alnum:]_])calloc[[:space:]]*\(|(^|[^[:alnum:]_])realloc[[:space:]]*\(|(^|[^[:alnum:]_:])free[[:space:]]*\(|(^|[^[:alnum:]_])new[[:space:](]|(^|[^[:alnum:]_])delete[[:space:](]' src; then
            echo "Accord allocations and owned FreeRTOS primitives must route through Strata"
            exit 1
          fi
          if grep -RInE '#include[[:space:]]+[<"]esp_heap_caps\.h[>"]' src; then
            echo "Accord must not depend on ESP-IDF allocation internals"
            exit 1
          fi
          if grep -RInE '#include[[:space:]]+[<"](Fresh|Pulse|Signal|Tempo|Trace|Worker|Vault|Link|Courier|Flow|Lingo|Phase)\.h[>"]' src; then
            echo "Embedded safety audit failed: Accord must not depend on other ZekStack libraries"
            exit 1
          fi
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  version-check:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate package version
        run: |
          args=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          python3 scripts/validate_version.py "${args[@]}"

  metadata-lint:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify library metadata
        run: grep -qx 'name=Accord' library.properties

      - name: Arduino Lint
        uses: arduino/arduino-lint-action@v1
        with:
          library-manager: false
          project-type: library

  host-logic-tests:
    runs-on: [self-hosted, zekstack-ci]
    needs: [source-audit, version-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Strata
        run: |
          rm -rf /tmp/accord-strata
          git clone --depth 1 --branch "${STRATA_VERSION}" \
            https://github.com/ZekStack/strata.git \
            /tmp/accord-strata

      - name: Build and run host logic and concurrency tests
        run: |
          g++ -std=c++20 -Wall -Wextra -pedantic -pthread \
            -Itests/host/stubs \
            -Isrc \
            -I/tmp/accord-strata/src \
            src/Accord.cpp \
            tests/host/test_accord.cpp \
            /tmp/accord-strata/src/strata/Allocation.cpp \
            /tmp/accord-strata/src/strata/internal/PlatformGeneric.cpp \
            -o /tmp/accord-host-tests
          /tmp/accord-host-tests

          g++ -std=c++20 -Wall -Wextra -pedantic -pthread \
            -Itests/host/stubs \
            -Isrc \
            -I/tmp/accord-strata/src \
            src/Accord.cpp \
            tests/host/test_memory.cpp \
            /tmp/accord-strata/src/strata/Allocation.cpp \
            /tmp/accord-strata/src/strata/internal/PlatformGeneric.cpp \
            -o /tmp/accord-memory-tests
          /tmp/accord-memory-tests

  build-examples:
    runs-on: [self-hosted, zekstack-ci]
    needs: [source-audit, version-check, host-logic-tests]
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, esp32-s3-devkitc-1, esp32-c3-devkitm-1, esp32-p4-evboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache PIOArduino
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-${{ hashFiles('**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-

      - name: Install PIOArduino Core
        run: python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"

      - name: Install PIOArduino ESP32 Platform
        run: pio pkg install -g -p "${PIOARDUINO_PLATFORM_URL}"

      - name: Build library examples
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Building $d on ${{ matrix.board }}"
              pio ci "$d" \
                --board ${{ matrix.board }} \
                --lib="." \
                --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
                --project-option "lib_deps=https://github.com/ZekStack/strata.git#${STRATA_VERSION}" \
                --project-option "build_unflags=-std=gnu++11" \
                --project-option "build_flags=-std=gnu++20"
            fi
          done

  arduino-cli:
    runs-on: [self-hosted, zekstack-ci]
    needs: [source-audit, version-check, host-logic-tests]
    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: esp32:esp32:esp32
            name: esp32dev
          - fqbn: esp32:esp32:esp32s3
            name: esp32-s3-devkitc-1
          - fqbn: esp32:esp32:esp32c3
            name: esp32-c3-devkitm-1
          - fqbn: esp32:esp32:esp32p4
            name: esp32-p4-evboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Cache Arduino CLI packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: ${{ runner.os }}-arduino-cli-${{ env.ARDUINO_CLI_VERSION }}-esp32-${{ env.ESP32_CORE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-arduino-cli-${{ env.ARDUINO_CLI_VERSION }}-esp32-

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Add local libraries to sketchbook
        run: |
          set -e
          SKETCHBOOK_DIR="${HOME}/Arduino"
          mkdir -p "$SKETCHBOOK_DIR/libraries/Accord"
          rsync -a --delete --exclude ".git" ./ "$SKETCHBOOK_DIR/libraries/Accord/"
          rm -rf "$SKETCHBOOK_DIR/libraries/Strata"
          git clone --depth 1 --branch "${STRATA_VERSION}" \
            https://github.com/ZekStack/strata.git \
            "$SKETCHBOOK_DIR/libraries/Strata"

      - name: Build examples (${{ matrix.board.name }})
        env:
          FQBN: ${{ matrix.board.fqbn }}
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Compiling $d"
              arduino-cli compile \
                --fqbn "$FQBN" \
                --build-property "compiler.cpp.extra_flags=-std=gnu++20" \
                "$d"
            fi
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-audit, version-check, metadata-lint, host-logic-tests, build-examples, arduino-cli]
    runs-on: [self-hosted, zekstack-ci]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate release changelog
        run: |
          python3 scripts/generate_release_changelog.py \
            --target-ref "${GITHUB_REF_NAME}" \
            --tag-name "${GITHUB_REF_NAME}" \
            --output "release-changelog.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          body_path: release-changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
